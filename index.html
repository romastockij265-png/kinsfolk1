<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10141D">
<title>Kinsfolk</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<script>try{var t=localStorage.getItem('kf_theme')||'auto',f=localStorage.getItem('kf_fs');document.documentElement.dataset.theme=(t==='light'||(t==='auto'&&matchMedia('(prefers-color-scheme: light)').matches))?'light':'dark';if(f)document.documentElement.style.setProperty('--fs',f+'px')}catch(e){document.documentElement.dataset.theme='dark'}</script>
</head>
<body>
<div id="app"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
